# OpenMimic default plugin configuration.
#
# Layers (later overrides earlier, merged by `use` key):
#   1. openmimic.yml (this file, committed)
#   2. openmimic.local.yml (gitignored)
#   3. OPENMIMIC_CONFIG env var → file path
#
# Set `enabled: false` on any entry to disable it in a higher layer.

plugins:
  - use: "@openmimic/engine-witness"
  - use: "@openmimic/engine-court"
    config: { pairThreshold: 0.55 }
  - use: "@openmimic/engine-room"
  - use: "@openmimic/mount-rest"
  - use: "@openmimic/mount-openai"
  - use: "@openmimic/mount-mcp"
  - use: "./plugins/collector-freetext"
  - use: "./plugins/scenario-review"
